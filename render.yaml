services:
  - type: web
    name: pharmacare
    runtime: python
    buildCommand: pip install -r requirements.txt && python Pharmacare/manage.py collectstatic --noinput && python Pharmacare/manage.py migrate
    startCommand: gunicorn --chdir Pharmacare pharmacare.wsgi:application --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        sync: false